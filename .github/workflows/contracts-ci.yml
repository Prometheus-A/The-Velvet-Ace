name: Contracts CI

on:
  push:
    branches:
      - main
      - "**"
    paths:
      - "**"
      - "**"
  pull_request:
    branches:
      - main
      - "**"
    paths:
      - "**"
      - "**"
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Dojo using dojoup
        run: |
          curl -L https://install.dojoengine.org | bash
          # Source the profile to get dojoup in PATH
          source ~/.profile || source ~/.bashrc || true
          # Check if dojoup exists and use full path if needed
          if [ -f "$HOME/.dojo/bin/dojoup" ]; then
            $HOME/.dojo/bin/dojoup install 1.5.0
          else
            # Try to find dojoup
            find $HOME -name "dojoup" -type f 2>/dev/null | head -1 | xargs -I {} {} install 1.5.0
          fi
          echo "$HOME/.dojo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Build contracts
        run: |
          cd poker-texas-hold-em/contract
          sozo build

      - name: Run tests
        run: |
          cd poker-texas-hold-em/contract
          sozo test

      - name: Check formatting
        run: |
          cd poker-texas-hold-em/contract
          scarb fmt --check

      - name: Tokens
        run: |
          cd poker-texas-hold-em/tokens
          scarb build
          snforge test
          scarb fmt --check
